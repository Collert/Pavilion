<svg class="cook-scene" role="img" aria-label="{{ label }}" width="{{ w }}" height="{{ h }}" viewBox="0 0 240 180"><circle cx="120" cy="96" r="78" fill="{{ bg }}"/>
{% if pot %}<g>
  <path d="M104 162c0-8 6-10 6-17 4 4 6 8 6 12 2-3 2-6 2-8 6 5 8 10 8 13a11 11 0 0 1-22 0z" fill="#F4A93B">{% if run %}<animateTransform attributeName="transform" type="scale" values="1 1;1.04 0.9;0.97 1.06;1 1" dur="0.6s" repeatCount="indefinite" additive="sum"/>{% endif %}</path>
  <path d="M126 164c0-6 4-8 4-13 3 3 4 6 4 9 2-2 2-4 2-6 4 4 5 7 5 9a7.5 7.5 0 0 1-15 1z" fill="#E8862B">{% if run %}<animate attributeName="opacity" values="1;0.6;1" dur="0.5s" repeatCount="indefinite"/>{% endif %}</path>
  <rect x="58" y="70" width="124" height="74" rx="18" fill="#14261F"/><rect x="44" y="82" width="20" height="10" rx="5" fill="#14261F"/><rect x="176" y="82" width="20" height="10" rx="5" fill="#14261F"/>
  <ellipse cx="120" cy="72" rx="62" ry="12" fill="#1F4A3A"/><ellipse cx="120" cy="73" rx="54" ry="8" fill="{{ liquid }}"/>
  {% if run %}<g>
    <circle cx="98" cy="74" r="5" fill="#FFFFFF" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="{{ bubble }}" repeatCount="indefinite"/><animate attributeName="r" values="1;6;7" dur="{{ bubble }}" repeatCount="indefinite"/></circle>
    <circle cx="128" cy="72" r="4" fill="#FFFFFF" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="{{ bubble }}" begin="0.35s" repeatCount="indefinite"/><animate attributeName="r" values="1;5;6" dur="{{ bubble }}" begin="0.35s" repeatCount="indefinite"/></circle>
    <circle cx="148" cy="75" r="3" fill="#FFFFFF" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="{{ bubble }}" begin="0.7s" repeatCount="indefinite"/><animate attributeName="r" values="1;4;5" dur="{{ bubble }}" begin="0.7s" repeatCount="indefinite"/></circle>
    <path d="M96 56c-6-8 6-12 0-20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -14" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M122 52c-6-8 6-12 0-20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -14" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></path>
    <path d="M146 56c-6-8 6-12 0-20" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;0.85;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;0 -14" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></path>
  </g>{% endif %}
</g>{% elif kind == "fry" %}<g>
  {% if run %}<g><path d="M104 166c0-6 4-8 4-13 3 3 4 6 4 9 2-2 2-4 2-6 4 4 5 7 5 9a7.5 7.5 0 0 1-15 1z" fill="#F4A93B"><animate attributeName="opacity" values="1;0.6;1" dur="0.45s" repeatCount="indefinite"/></path><path d="M124 166c0-6 4-8 4-13 3 3 4 6 4 9 2-2 2-4 2-6 4 4 5 7 5 9a7.5 7.5 0 0 1-15 1z" fill="#E8862B"><animate attributeName="opacity" values="0.6;1;0.6" dur="0.5s" repeatCount="indefinite"/></path></g>{% endif %}
  <rect x="170" y="118" width="58" height="12" rx="6" fill="#14261F"/>
  <path d="M44 112h136a4 4 0 0 1 4 4c0 18-14 30-32 30H76c-18 0-32-12-32-30a4 4 0 0 1 4-4z" fill="#14261F"/>
  <ellipse cx="112" cy="113" rx="64" ry="9" fill="#1F4A3A"/>
  <g fill="#F4C46B">
    <ellipse cx="88" cy="108" rx="9" ry="5">{% if run %}<animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="0.9s" repeatCount="indefinite"/>{% endif %}</ellipse>
    <ellipse cx="112" cy="110" rx="10" ry="5">{% if run %}<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="1.1s" begin="0.3s" repeatCount="indefinite"/>{% endif %}</ellipse>
    <ellipse cx="136" cy="108" rx="8" ry="4.5">{% if run %}<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.8s" begin="0.15s" repeatCount="indefinite"/>{% endif %}</ellipse>
  </g>
  {% if run %}<g fill="#FFFFFF">
    <circle cx="72" cy="96" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="92" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="122" cy="84" r="2"><animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="86" r="2"><animate attributeName="opacity" values="0;1;0" dur="0.65s" begin="0.1s" repeatCount="indefinite"/></circle>
  </g>{% endif %}
</g>{% elif kind == "bake" %}<g>
  <rect x="56" y="52" width="128" height="104" rx="18" fill="#14261F"/><circle cx="80" cy="66" r="4" fill="#5B6A62"/><circle cx="96" cy="66" r="4" fill="#5B6A62"/><rect x="140" y="62" width="30" height="8" rx="4" fill="#5B6A62"/>
  <rect x="70" y="80" width="100" height="62" rx="12" fill="#3A2A12"/>
  <rect x="70" y="80" width="100" height="62" rx="12" fill="#F4A93B" opacity="0.55">{% if run %}<animate attributeName="opacity" values="0.35;0.75;0.35" dur="2s" repeatCount="indefinite"/>{% endif %}</rect>
  <path d="M86 132c0-10 8-16 18-16s18 6 18 16z M118 132c0-10 8-16 18-16s18 6 18 16z" fill="#F4C46B"/>
  {% if run %}<g fill="none" stroke="#F4A93B" stroke-width="4" stroke-linecap="round">
    <path d="M92 44c-5-5 5-9 0-14" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 4;0 -10" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M120 44c-5-5 5-9 0-14" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 4;0 -10" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></path>
    <path d="M148 44c-5-5 5-9 0-14" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 4;0 -10" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></path>
  </g>{% endif %}
</g>{% elif kind == "rise" or kind == "rest" %}<g>
  <ellipse cx="120" cy="104" rx="56" ry="38" fill="#F6E3BF">{% if run %}<animate attributeName="ry" values="30;44;30" dur="4s" repeatCount="indefinite"/><animate attributeName="cy" values="110;98;110" dur="4s" repeatCount="indefinite"/>{% endif %}</ellipse>
  <path d="M48 104h144l-10 40a16 16 0 0 1-15 12H73a16 16 0 0 1-15-12z" fill="#1F4A3A"/><rect x="44" y="100" width="152" height="10" rx="5" fill="#14261F"/>
  {% if kind == "rest" %}<g fill="#1F4A3A" font-family="Manrope, sans-serif" font-weight="800">
    <text x="158" y="58" font-size="18" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;8 -10" dur="3s" repeatCount="indefinite"/>z</text>
    <text x="170" y="44" font-size="24" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 6;8 -10" dur="3s" begin="1s" repeatCount="indefinite"/>z</text>
  </g>{% endif %}
</g>{% elif cold %}<g>
  {% if kind == "thaw" %}<g>
    <rect x="86" y="70" width="68" height="64" rx="14" fill="#CFE6EE" stroke="#8FC0D2" stroke-width="4">{% if run %}<animate attributeName="height" values="64;56;64" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="70;78;70" dur="5s" repeatCount="indefinite"/>{% endif %}</rect>
    <path d="M98 84h16" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><ellipse cx="120" cy="146" rx="46" ry="7" fill="#CFE6EE"/>
    {% if run %}<g fill="#8FC0D2">
      <path d="M104 136c3 5 5 8 5 10a5 5 0 0 1-10 0c0-2 2-5 5-10z"><animateTransform attributeName="transform" type="translate" values="0 -4;0 8" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/></path>
      <path d="M138 136c3 5 5 8 5 10a5 5 0 0 1-10 0c0-2 2-5 5-10z"><animateTransform attributeName="transform" type="translate" values="0 -4;0 8" dur="1.4s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.4s" begin="0.7s" repeatCount="indefinite"/></path>
    </g>{% endif %}
  </g>{% else %}<g fill="none" stroke="#5E9DB6" stroke-width="7" stroke-linecap="round"><g>
    {% if run %}<animateTransform attributeName="transform" type="rotate" values="0 120 98;60 120 98" dur="6s" repeatCount="indefinite"/>{% endif %}
    <path d="M120 58v80 M85 78l70 40 M85 118l70-40"/>
    <path d="M110 64l10 8 10-8 M110 132l10-8 10 8 M88 90l12-1 -4-12 M152 106l-12 1 4 12 M88 106l12 1-4 12 M152 90l-12-1 4-12" stroke-width="5"/>
  </g></g>{% endif %}
  {% if run %}<g fill="#FFFFFF" stroke="#8FC0D2" stroke-width="1.5">
    <circle cx="64" cy="40" r="5"><animateTransform attributeName="transform" type="translate" values="0 0;6 110" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="176" cy="34" r="4"><animateTransform attributeName="transform" type="translate" values="0 0;-6 120" dur="5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="30" r="3"><animateTransform attributeName="transform" type="translate" values="0 0;4 120" dur="4.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="28" r="3.5"><animateTransform attributeName="transform" type="translate" values="0 0;-4 116" dur="5.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="5.5s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>{% endif %}
</g>{% else %}<g>
  <rect x="46" y="112" width="148" height="30" rx="12" fill="#C9A06A"/><rect x="46" y="112" width="148" height="10" rx="5" fill="#D9B784"/>
  <g>{% if run %}<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="0.8s" repeatCount="indefinite"/>{% endif %}
    <path d="M100 58l64 44-8 8-64-44z" fill="#DCE3DF"/><path d="M92 58l14 10-10 6-12-8z" fill="#14261F"/>
  </g>
  <circle cx="86" cy="106" r="7" fill="#F4A93B"/><circle cx="104" cy="108" r="6" fill="#F4C46B"/>
</g>{% endif %}
</svg>

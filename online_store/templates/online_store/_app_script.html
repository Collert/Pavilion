{% load static push_tags %}{% comment %}The store app's service worker and push subscription (online_store/static/online_store/push.js). Not in the admin's preview.{% endcomment %}
{% if not preview %}<script type="module" src="{% static 'online_store/push.js' %}" id="store-push"
        data-worker="{% url 'store_worker' %}" data-scope="{% url 'store_home' %}" data-key="{% vapid_key %}"
        data-sync="{% url 'store_push_sync' %}" data-forget="{% url 'store_push_forget' %}" data-user="{{ request.user.pk|default:'' }}"></script>{% endif %}

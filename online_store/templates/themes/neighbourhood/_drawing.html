{% comment %}A food drawing for dishes without a photo: kind = burger, sandwich, bowl, fries, latte, lemonade, croissant, tart or plate (online_store.storefront.drawing), size in px.{% endcomment %}
<svg class="drawing" role="img" aria-label="{{ label|default:kind }}" width="{{ size|default:200 }}" height="{{ size|default:200 }}" viewBox="0 0 200 200">
{% if kind == "burger" %}<g>
        <ellipse cx="100" cy="168" rx="70" ry="9" fill="#000" opacity=".12"/>
        <path d="M34 92c0-34 30-52 66-52s66 18 66 52z" fill="#E9A64B"/>

        <path d="M30 98h140l-10 12-12-6-12 8-12-6-12 8-12-6-12 8-12-6-12 8-12-6-12 8z" fill="#7FB53E"/>
        <path d="M34 108h132l-6 18-60 6-60-6z" fill="#F2C230"/>
        <rect x="34" y="118" width="132" height="22" rx="11" fill="#6B3A1E"/>
        <path d="M34 146h132a0 0 0 0 1 0 0c0 14-12 22-28 22H62c-16 0-28-8-28-22z" fill="#D9933F"/>
      </g>
{% elif kind == "sandwich" %}<g>
        <ellipse cx="100" cy="170" rx="72" ry="9" fill="#000" opacity=".12"/>

        <path d="M30 134h140c0 20-14 30-32 30H62c-18 0-32-10-32-30z" fill="#E6A956"/>
        <path d="M150 104l18 -14" stroke="#F4D35E" stroke-width="5" stroke-linecap="round"/>
      </g>
{% elif kind == "bowl" %}<g>
        <ellipse cx="100" cy="170" rx="70" ry="9" fill="#000" opacity=".12"/>
        <ellipse cx="100" cy="96" rx="74" ry="20" fill="#F1E3C6"/>
        <circle cx="70" cy="88" r="16" fill="#7FB53E"/>
        <circle cx="96" cy="80" r="14" fill="#5E9B2D"/>

        <circle cx="56" cy="102" r="7" fill="#E9A64B"/>

        <path d="M40 112c8 22 30 38 60 38" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".2" fill="none"/>
      </g>
{% elif kind == "fries" %}<g>
        <ellipse cx="100" cy="174" rx="54" ry="8" fill="#000" opacity=".12"/>
        <g fill="#F2C230" stroke="#D9A21E" stroke-width="2">
          <rect x="62" y="34" width="14" height="80" rx="4" transform="rotate(-10 69 74)"/>
          <rect x="82" y="26" width="14" height="86" rx="4" transform="rotate(-3 89 69)"/>

        <path d="M93 132l5 5 9-10" stroke="#E2442F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
{% elif kind == "latte" %}<g>
        <ellipse cx="100" cy="174" rx="50" ry="8" fill="#000" opacity=".12"/>
        <path d="M58 52h84l-10 118H68z" fill="#FFFFFF" opacity=".55" stroke="#C9D6CF" stroke-width="3"/>

{% elif kind == "croissant" %}<g>

{% elif kind == "tart" %}<g>

        <path d="M100 84c-8-14-2-30 14-36" stroke="#5E9B2D" stroke-width="6" stroke-linecap="round" fill="none"/>
      </g>
{% else %}<g>
        <ellipse cx="100" cy="162" rx="72" ry="9" fill="#000" opacity=".12"/>
        <ellipse cx="100" cy="120" rx="80" ry="34" fill="#FFFFFF" stroke="#DDE4DF" stroke-width="3"/>
        <ellipse cx="100" cy="116" rx="54" ry="20" fill="#EEF2EF"/>

{% endif %}</svg>
